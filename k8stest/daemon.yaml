apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-agent
  namespace: k8slab

spec:
  selector:
    matchLabels:
      app: node-agent

  template:
    metadata:
      labels:
        app: node-agent  

    spec:
      containers:
      - name: nginx
        image: nginx:1.26-alpine

        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName