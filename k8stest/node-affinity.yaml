apiVersion: v1
kind: Pod

metadata:
  name: affinity-pod
  namespace: k8slab

spec:
  affinity:
    nodeAffinity:
      # requiredDuringSchedulingIgnoredDuringExecution:
      #   nodeSelectorTerms:
      #   - matchExpressions:
      #     - key: workload
      #       operator: In
      #       values:
      #       - backend

      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference: 
          matchExpressions:
          - key: disk
            operator: In # In,NotIn,Exists,DoesNotExist,Gt,Lt
            values:
            - ssd




  containers:
  - name: nginx
    image: nginx:1.26-alpine