apiVersion: apps/v1
kind: Deployment

metadata:
  name: observability-demo
  namespace: kubernetes-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: observability-demo

  template:
    metadata:
      labels:
        app: observability-demo

    spec:
      containers:
        - name: app
          image: nginx:1.26-alpine
          ports:
            - containerPort: 80