apiVersion: v1
kind: Pod

metadata:
  name: multi-container-logging
  namespace: kubernetes-lab

spec:
  containers:

    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true
          do
            echo "$(date) APP: processing request"
            sleep 5
          done

    - name: sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true
          do
            echo "$(date) SIDECAR: processing logs"
            sleep 7
          done