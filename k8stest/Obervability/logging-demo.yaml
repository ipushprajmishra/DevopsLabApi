apiVersion: v1
kind: Pod

metadata:
  name: logging-demo
  namespace: kubernetes-lab

spec:
  containers:
    - name: app
      image: busybox:1.36

      command:
        - sh
        - -c
        - |
          i=1
          while true
          do
            echo "$(date) INFO application message $i"
            echo "$(date) ERROR example error $i" >&2
            i=$((i+1))
            sleep 5
          done