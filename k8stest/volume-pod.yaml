apiVersion: v1
kind: Pod
metadata:
  name: volume-test
  namespace: k8slab
spec: 
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
       - containerPort: 80
      
      volumeMounts:
        - name: data
          mountPath: /data
      
  volumes:
  - name: data
    emptyDir: {}