apiVersion: v1
kind: Pod
metadata:
  name: security-hardened
  namespace: kubernetes-lab

spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000

  containers:
    - name: nginx
      image: nginx:1.26-alpine

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

      volumeMounts:
        - name: tmp
          mountPath: /tmp

  volumes:
    - name : tmp
      emptyDir: {}