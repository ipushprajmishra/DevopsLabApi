apiVersion: v1
kind: Pod

metadata:
  name: pss-restricted
  namespace: pss-lab

spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: nginx
      image: nginx:1.26-alpine

      securityContext:
        allowPrivilegeEscalation: false

        capabilities:
          drop:
            - ALL