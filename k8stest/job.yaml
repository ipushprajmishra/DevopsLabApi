apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
  namespace: k8slab

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
      - name: hello
        image: busybox:1.36

        command:
          - sh
          - -c
          - |
            echo "Job started"
            sleep 10
            echo "Job Completed"