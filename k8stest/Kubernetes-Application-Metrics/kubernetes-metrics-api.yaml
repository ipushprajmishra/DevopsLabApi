apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-metrics-api
  namespace: kubernetes-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-metrics-api
  template:
    metadata:
      labels:
        app: kubernetes-metrics-api
    spec:
      containers:
        - name: api
          image: kubernetes-metrics-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080