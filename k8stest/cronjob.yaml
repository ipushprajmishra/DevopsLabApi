apiVersion: batch/v1
kind: CronJob

metadata:
  name: hello-cron
  namespace: k8slab

spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Allow
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
          - name: failure
            image: busybox:1.36
            command: ['sh', '-c', 'echo "CronJob executed at $(date)"']