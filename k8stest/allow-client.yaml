apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-client
  namespace: network-lab

spec:
  podSelector: 
    matchLabels:
      app: backend

  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: client
    # - namespaceSelector:
    #   matchLabels:
    #     environment: dev

    ports:
    - protocol: TCP
      port: 80