apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-backend-egress
  namespace: network-lab

spec:
  podSelector:
    matchLabels:
      role: client

  policyTypes:
  - Egress

  egress:
    - to:
      - podSelector:
          matchLabels:
            app: backend

      ports:
        - protocol: TCP
          port: 80