apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: web
  namespace: k8slab

spec:
  serviceName: web
  replicas: 3

  selector:
    matchLabels:
      app: web
  
  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
      - name: nginx
        image: nginx:1.26-alpine
        volumeMounts:
        - name: data
          mountPath: /data

        ports:
        - containerPort: 80
        

  volumeClaimTemplates:
  - metadata:
      name: data


    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 1Gi
